name: CI

# Five apps import this package, so a bug here breaks all five at once. Until
# 2026-08-05 nothing ran these tests automatically (#1) — the one repo the fleet
# depends on was the one repo with no CI.
on:
  push:
  pull_request:

# Supersede stale runs on branches/PRs; let every run on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # The consumers are not all on one version: the server runs 3.14, the apps'
      # CI also tests 3.11/3.12, and pyproject claims >=3.10. Test all three.
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
